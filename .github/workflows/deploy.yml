name: Clean Deploy via Temp Folder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeweb-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare remote temp directory
        timeout-minutes: 3
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -eu

          PORT="${DEPLOY_PORT:-22}"
          TEMP_DIR="/home/c/cs16144/www452/temp"

          SSH_OPTS="-i $HOME/.ssh/deploy_key -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=5 -o ServerAliveCountMax=2"

          for attempt in 1 2 3; do
            echo "Attempt $attempt: connecting via SSH on port $PORT"

            if ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
              "mkdir -p '$TEMP_DIR' && echo TEMP_READY"; then
              exit 0
            else
              echo "Attempt $attempt failed (ssh exit code $?)"
            fi

            sleep 10
          done

          echo "All attempts failed. Verbose diagnostic run:"
          ssh -v $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "id; ls -ld '$(dirname "$TEMP_DIR")'; mkdir -p '$TEMP_DIR' && echo TEMP_READY" || true
          exit 1

      - name: Upload repository to temp
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -eu
          PORT="${DEPLOY_PORT:-22}"
          TEMP_DIR="/home/c/cs16144/www452/temp"

          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='log/' \
            --exclude='images/' \
            --exclude='data/images/' \
            --exclude='data/uploads/' \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$TEMP_DIR/"

      - name: Sync temp to public_html
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          PORT="${DEPLOY_PORT:-22}"
          TEMP_DIR="/home/c/cs16144/www452/temp"

          if [ "$DEPLOY_PATH" != "/home/c/cs16144/www452/public_html" ]; then
            echo "Unexpected DEPLOY_PATH; stopping deployment."
            exit 1
          fi

          ssh -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "rsync -av --delete \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='.gitignore' \
              --exclude='.gitattributes' \
              --exclude='log/' \
              --exclude='images/' \
              --exclude='data/images/' \
              --exclude='data/uploads/' \
              '$TEMP_DIR/' '$DEPLOY_PATH/'"

      - name: Deployment completed
        run: echo "Deployment completed successfully!"