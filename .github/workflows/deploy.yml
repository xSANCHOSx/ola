
name: Clean Deploy via Temp Folder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Diagnose Timeweb SSH
        timeout-minutes: 2
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -eu

          echo "Checking SSH configuration..."
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is empty"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is empty"; exit 1; }

          PORT="${DEPLOY_PORT:-22}"

          echo "User configured: yes"
          echo "Host configured: yes"
          echo "Port configured: yes"

          echo "Resolving SSH host..."
          getent ahosts "$DEPLOY_HOST" || true

          echo "Testing TCP port..."
          if timeout 10 bash -c 'cat < /dev/null > /dev/tcp/$1/$2' _ "$DEPLOY_HOST" "$PORT"; then
            echo "TCP_OK"
          else
            echo "TCP_FAILED"
          fi

          echo "Testing SSH authentication..."

          ssh -vv \
            -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'echo SSH_OK; pwd; command -v rsync; test -w /home/c/cs16144/www452/public_html && echo SITE_WRITABLE'
