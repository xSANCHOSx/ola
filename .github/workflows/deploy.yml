
name: Clean Deploy via Temp Folder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeweb-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      
      - name: Prepare remote temp directory
        timeout-minutes: 2
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -eu

          PORT="${DEPLOY_PORT:-22}"
          TEMP_DIR="/home/c/cs16144/www452/temp"

          for attempt in 1 2 3; do
            echo "SSH attempt $attempt of 3"

            if ssh -i ~/.ssh/deploy_key \
              -p "$PORT" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ConnectionAttempts=1 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "mkdir -p '$TEMP_DIR'"; then
              echo "Remote temp directory is ready."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Connection failed; retrying in 5 seconds..."
              sleep 5
            fi
          done

          echo "Could not connect to Timeweb after 3 attempts."
          exit 1


      - name: Upload repository to temp
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -eu
          PORT="${DEPLOY_PORT:-22}"
          TEMP_DIR="/home/c/cs16144/www452/temp"

          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='log/' \
            --exclude='images/' \
            --exclude='data/images/' \
            --exclude='data/uploads/' \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$TEMP_DIR/"

      - name: Sync temp to public_html
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          PORT="${DEPLOY_PORT:-22}"
          TEMP_DIR="/home/c/cs16144/www452/temp"

          if [ "$DEPLOY_PATH" != "/home/c/cs16144/www452/public_html" ]; then
            echo "Unexpected DEPLOY_PATH; stopping deployment."
            exit 1
          fi

          ssh -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "rsync -av --delete \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='.gitignore' \
              --exclude='.gitattributes' \
              --exclude='log/' \
              --exclude='images/' \
              --exclude='data/images/' \
              --exclude='data/uploads/' \
              '$TEMP_DIR/' '$DEPLOY_PATH/'"

      - name: Deployment completed
        run: echo "Deployment completed successfully!"
